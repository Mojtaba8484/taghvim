name: 💎 نسخه ۲۴ نهایی سبز (تقویم ۲۰۰ ساله SQLite و اصلاح اعداد تقویم)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Download Base Project and Apply v24 SQLite Calendar
        run: |
          rm -rf *
          python3 -c 'import urllib.request as u; a="[https://drive.google.com/uc?export=download"; b=chr(38); c="id="; u.urlretrieve("".join([a,b,c,"1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO"]),"p.tar.gz"); u.urlretrieve("".join([a,b,c,"1Oy_Ob-pvKZr0q6hRYmsutXUSh1fvWVzS"]),"patch.py")'
          tar -xzf p.tar.gz
          python3 patch.py

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalendar-Release-Signed-APK
          path: app/build/outputs/apk/release/*.apk](https://drive.google.com/uc?export=download"; b=chr(38); c="id="; u.urlretrieve("".join([a,b,c,"1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO"]),"p.tar.gz"); u.urlretrieve("".join([a,b,c,"1Oy_Ob-pvKZr0q6hRYmsutXUSh1fvWVzS"]),"patch.py")'
          tar -xzf p.tar.gz
          python3 patch.py

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalendar-Release-Signed-APK
          path: app/build/outputs/apk/release/*.apk)
