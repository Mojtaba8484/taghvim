name: V29-GREEN-ADHAN-GPS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download Base Project and V29 Patch
        run: |
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://drive.google.com/uc?export=download' + chr(38) + 'id=1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO', 'project.tar.gz')"
          tar -xzf project.tar.gz
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://drive.google.com/uc?export=download' + chr(38) + 'id=1p-AXysaQIwNSJRKY6yACHjD5EzEAw9l0', 'patch.py')"
          python3 patch.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload V29 Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: V29-GREEN-Taghvim-APK
          path: app/build/outputs/apk/release/*.apk
