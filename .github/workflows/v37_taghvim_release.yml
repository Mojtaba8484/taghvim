name: V37-CLEAN-SOUND-BIGLOGO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Download Base Project and Apply V37 Patch
        run: |
          pip install -q gdown
          gdown 1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO -O base.tar.gz
          tar -xzf base.tar.gz
          gdown 1ogF3GZZAkt6TQbNgKi8Vg6VknLuD8Pw7 -O patch.py
          python3 patch.py

      - name: Build, Verify & Prepare Backup Bundle
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p release_bundle/Backup_For_Future_Updates
          cp app/build/outputs/apk/release/app-release.apk release_bundle/Taghvim_Hooshmand_v37.apk
          cp app/release-key.jks release_bundle/Backup_For_Future_Updates/release-key.jks
          cp app/build.gradle release_bundle/Backup_For_Future_Updates/build.gradle.bak
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose release_bundle/Taghvim_Hooshmand_v37.apk
          fi

      - name: Upload V37 APK + Backup Folder ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Taghvim_Hooshmand_v37_With_Backup
          path: release_bundle/
