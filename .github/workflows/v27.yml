name: 🟢 نسخه ۲۷ نهایی سبز (تقویم رسمی دانشگاه تهران ۱۴۰۶ + SQLite v4 + حذف پنل مدیریت)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Download Base Project & Apply V27 Official Calendar Patch
        run: |
          python3 -c "import urllib.request; u1='https://drive.google.com/uc?export=download'+chr(38)+'id=1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO'; urllib.request.urlretrieve(u1, 'project.tar.gz'); u2='https://drive.google.com/uc?export=download'+chr(38)+'id=1n5NastIqrrKBbaEWLw-38lbyTBNDa_dQ'; urllib.request.urlretrieve(u2, 'patch.py')"
          tar -xzf project.tar.gz
          python3 patch.py

      - name: Build Signed Release APK for Cafe Bazaar
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed Cafe Bazaar Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Taghvim-Hooshmand-v27-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk
