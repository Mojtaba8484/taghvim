name: V31-CITIES-WEATHER-9ESFAND

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download Base Project and Apply V31 Patch
        run: |
          pip install -q gdown
          gdown 1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO -O base.tar.gz
          tar -xzf base.tar.gz
          gdown 1AP5ogL3sT8vYPp1TklIDev7vVSvBE5W8 -O patch.py
          python3 patch.py

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload V31 Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalendar-v31-Release-APK
          path: app/build/outputs/apk/release/*.apk
