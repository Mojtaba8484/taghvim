name: "💎 نسخه ۱۰ نهایی تضمینی (تقویم، اذان، مکان اراک و فونت درشت)"

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download & Upgrade Project v10
        run: |
          rm -rf *
          curl -L "https://drive.google.com/uc?export=download&id=1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO" -o proj.tar.gz
          tar -xzf proj.tar.gz
          curl -L "https://drive.google.com/uc?export=download&id=19OsFWzhGOIvvzkXk3Tet8Y59kGA_op7W" -o patch_v10.py
          python3 patch_v10.py

      - name: Build Signed Release APK v10
        run: |
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Taghvim-Hooshmand-Final-v10-APK
          path: app/build/outputs/apk/release/app-release.apk
