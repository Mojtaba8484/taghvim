name: Build Signed APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download App & Generate 30-Year Key
        run: |
          mkdir -p app/src/main/assets app/src/main/java/ir/taghvim/hooshmand
          curl -L "https://drive.google.com/uc?export=download&id=1JPMxOMBwzkCwtX82oFnJMhdj2F3fYn_m" -o app/src/main/assets/index.html
          keytool -genkeypair -v -keystore app/release-key.jks -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10950 -alias taghvim_key -storepass Taghvim1405 -keypass Taghvim1405 -dname "CN=Taghvim,O=Taghvim,L=Arak,C=IR"
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal(); maven { url "https://maven.tapsell.ir" } } }
          dependencyResolutionManagement { repositories { google(); mavenCentral(); maven { url "https://maven.tapsell.ir" } } }
          rootProject.name = "TaghvimHooshmand"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          buildscript { repositories { google(); mavenCentral(); maven { url "https://maven.tapsell.ir" } }; dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
            namespace 'ir.taghvim.hooshmand'
            compileSdk 34
            defaultConfig { applicationId "ir.taghvim.hooshmand"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0.0" }
            signingConfigs { release { storeFile file("release-key.jks"); storePassword "Taghvim1405"; keyAlias "taghvim_key"; keyPassword "Taghvim1405"; v1SigningEnabled true; v2SigningEnabled true } }
            buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'ir.tapsell.plus:tapsell-plus-sdk-android:2.2.8' }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ir.taghvim.hooshmand">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:allowBackup="true" android:label="تقویم هوشمند" android:supportsRtl="true" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/java/ir/taghvim/hooshmand/MainActivity.java
          package ir.taghvim.hooshmand;
          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.*;
          import android.view.*;
          import android.widget.FrameLayout;
          import androidx.appcompat.app.AppCompatActivity;
          import ir.tapsell.plus.*;
          import ir.tapsell.plus.model.*;
          public class MainActivity extends AppCompatActivity {
            public static final String KEY = "nhjqhcsheforofclgsrkbjicbgerqfpnfelepqhngnekpfloenofgtipnqpakbfhlcdddl";
            public static final String Z_WHEEL = "6aee21f77bbc2b44c58a8766";
            public static final String Z_BANNER = "6aee22e6a2434702499bd12c";
            private WebView wv;
            private FrameLayout bannerBox;
            @SuppressLint("SetJavaScriptEnabled")
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              FrameLayout root = new FrameLayout(this);
              wv = new WebView(this);
              root.addView(wv, new FrameLayout.LayoutParams(-1, -1));
              bannerBox = new FrameLayout(this);
              FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(-2, -2);
              lp.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
              root.addView(bannerBox, lp);
              setContentView(root);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              wv.addJavascriptInterface(new JsBridge(), "AndroidTapsell");
              wv.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String u = r.getUrl().toString();
                  if (u.startsWith("http")) { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); return true; }
                  return false;
                }
              });
              wv.loadUrl("file:///android_asset/index.html");
              TapsellPlus.initialize(this, KEY, new TapsellPlusInitListener() {
                @Override public void onInitializeSuccess(AdNetworks a) {
                  TapsellPlus.requestStandardBannerAd(MainActivity.this, Z_BANNER, TapsellPlusBannerType.BANNER_320x50, new AdRequestCallback() {
                    @Override public void response(TapsellPlusAdModel m) { TapsellPlus.showStandardBannerAd(MainActivity.this, m.getResponseId(), bannerBox, new AdShowListener() {}); }
                    @Override public void error(String e) {}
                  });
                }
                @Override public void onInitializeFailed(AdNetworks a, AdNetworkError e) {}
              });
            }
            public class JsBridge {
              @JavascriptInterface public void initialize(String k) {}
              @JavascriptInterface public void showRewardedAd(String z) {
                runOnUiThread(() -> TapsellPlus.requestRewardedVideoAd(MainActivity.this, z, new AdRequestCallback() {
                  @Override public void response(TapsellPlusAdModel m) {
                    TapsellPlus.showRewardedVideoAd(MainActivity.this, m.getResponseId(), new AdShowListener() {
                      @Override public void onRewarded(TapsellPlusAdModel a) { wv.evaluateJavascript("if(window.onTapsellRewardGranted)window.onTapsellRewardGranted();", null); }
                    });
                  }
                  @Override public void error(String e) { wv.evaluateJavascript("if(window.onTapsellRewardGranted)window.onTapsellRewardGranted();", null); }
                }));
              }
            }
            @Override public void onBackPressed() { if (wv.canGoBack()) wv.goBack(); else super.onBackPressed(); }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Signed Release APK
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Taghvim-Hooshmand-CafeBazaar-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/release-key.jks
