name: V35-8SLOTS-SMARTBTN-ICON

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Download Base Project and Apply V35 Patch
        run: |
          pip install -q gdown
          gdown 1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO -O base.tar.gz
          tar -xzf base.tar.gz
          gdown 1T8JaWVjSgHDpeMZFA6JAlbu4nh4KQoTb -O patch.py
          python3 patch.py

      - name: Build and Verify Signed Release APK
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Taghvim_Hooshmand_v35.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose app/build/outputs/apk/release/Taghvim_Hooshmand_v35.apk
          fi

      - name: Upload V35 Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Taghvim_Hooshmand_v35
          path: app/build/outputs/apk/release/Taghvim_Hooshmand_v35.apk
