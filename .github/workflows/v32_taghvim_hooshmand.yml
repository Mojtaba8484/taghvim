name: V32-TAGHVIM-HOOSHMAND-RELEASE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Download Base Project and Apply V32 Patch
        run: |
          pip install -q gdown
          gdown 1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO -O base.tar.gz
          tar -xzf base.tar.gz
          gdown 1B2b3RaHjqFBafjZvLrrW3oH8sLXOBFwI -O patch.py
          python3 patch.py

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TaghvimHooshmand-v32-Release.apk

      - name: Upload V32 Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TaghvimHooshmand-v32-Release
          path: app/build/outputs/apk/release/TaghvimHooshmand-v32-Release.apk
