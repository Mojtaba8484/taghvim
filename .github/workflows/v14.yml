name: "🏆 نسخه ۱۴ نهایی تضمینی (بدون خطای SDK)"

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Download and Upgrade Project
        run: |
          rm -rf *
          python3 -c 'import urllib.request; a="https://drive.google.com/uc?export=download"; b=chr(38); c="id="; urllib.request.urlretrieve("".join([a,b,c,"1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO"]),"proj.tar.gz"); urllib.request.urlretrieve("".join([a,b,c,"1dBf2jwDPTn9jb9UKDUD57YpJS46nEI0i"]),"patch.py")'
          tar -xzf proj.tar.gz
          python3 patch.py

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Taghvim-Hooshmand-Final-v14-APK
          path: app/build/outputs/apk/release/app-release.apk
