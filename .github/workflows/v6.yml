name: "⭐ نسخه جدید نهایی (نسخه ۶)"
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download Full Project v6
        run: |
          curl -sL "https://drive.google.com/uc?export=download&id=1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO" -o proj.tar.gz || true
          if ! tar -tzf proj.tar.gz >/dev/null 2>&1; then
            curl -sL "https://drive.usercontent.google.com/download?id=1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO&export=download&confirm=t" -o proj.tar.gz || true
          fi
          if ! tar -tzf proj.tar.gz >/dev/null 2>&1; then
            pip install -q gdown && gdown 1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO -O proj.tar.gz
          fi
          tar -xzf proj.tar.gz
          rm -f proj.tar.gz
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"
      - name: Build Signed APK v6
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Taghvim-Hooshmand-NEW-v6-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/release-key.jks
