name: 🟢 نسخه ۲۳ نهایی سبز (تقویم ۲۰۰ ساله SQLite + اصلاح اعداد تقویم)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v23.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Signed Release APK
        run: |
          pip install gdown
          gdown 1N6uaZbvuOavI7Z2xg-IKeR0HMdR6KriO -O project.tar.gz
          tar -xzf project.tar.gz
          gdown 1Oy_Ob-pvKZr0q6hRYmsutXUSh1fvWVzS -O patch.py
          python3 patch.py
          chmod 755 gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SmartCalendar-Release-Signed-APK
          path: app/build/outputs/apk/release/*.apk
